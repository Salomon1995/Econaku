
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Econaku</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5ef;
            color: #26352b;
        }

        header {
            background: #315c43;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000012;
        }

        h2 {
            color: #315c43;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #477b58;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #315c43;
        }
        /* Formulario de especies */
        #formulario-especie {
            margin-top: 20px;
            border: 1px solid #dce7dd;
        }

        #formulario-especie h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        #form-especie {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
        }

        #form-especie label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #315c43;
        }

        #form-especie input,
        #form-especie select,
        #form-especie textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd8ce;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        #form-especie textarea {
            min-height: 100px;
            resize: vertical;
        }

        #form-especie button {
            margin-top: 10px;
        }

        /* Elementos que ocupan todo el ancho */
        #form-especie > div:has(textarea),
        #form-especie button,
        #habitats-especie {
            grid-column: 1 / -1;
        }

       /* Adaptación a celulares */
        @media (max-width: 600px) {
            #form-especie {
                grid-template-columns: 1fr;
            }

            #form-especie textarea,
            #form-especie button,
            #habitats-especie {
                grid-column: 1;
            }
         }
    </style>
</head>

<body>

    <header>
       <h1>Panel de administración</h1>
       <p>Econaku | Gestión del catálogo</p>

       <button onclick="window.location.href='Econaku.html'">
            Volver a Econaku
       </button>
    </header>

    <main>

        <section class="panel">
            <h2>Bienvenido, administrador</h2>
            <p>Desde este espacio podrás gestionar la información de Econaku.</p>
        </section>

        <section class="panel">
            <h2>Gestión de especies</h2>
            <div class="acciones">
               <button onclick="mostrarFormularioEspecie()">
                    Registrar especie
               </button>
               <button onclick="consultarEspecies()">
                     Consultar especies
               </button>
            </div>

<div id="contenido-especies"></div>
<div id="formulario-especie" class="panel" style="display: none;">
    <h2 id="titulo-formulario">Registrar nueva especie</h2>

    <form id="form-especie">

    <div>
        <label for="codigo-especie">Código:</label>
        <input type="text" id="codigo-especie" required>
    </div>

    <div>
        <label for="nombre-especie">Nombre común:</label>
        <input type="text" id="nombre-especie" required>
    </div>

    <div>
        <label for="cientifico-especie">Nombre científico:</label>
        <input type="text" id="cientifico-especie">
    </div>

    <div>
        <label for="categoria-especie">Categoría:</label>
        <select id="categoria-especie" required>
            <option value="">Seleccionar categoría</option>
            <option value="flora">Flora</option>
            <option value="fauna">Fauna</option>
            <option value="hongos">Hongos</option>
        </select>
    </div>

    <div>
    <label for="rareza-especie">Rareza:</label>
    <select id="rareza-especie" required>
        <option value="">Seleccionar rareza</option>
        <option value="comun">Común</option>
        <option value="poco_comun">Poco común</option>
        <option value="rara">Rara</option>
        <option value="muy_rara">Muy rara</option>
    </select>
    </div>

    <div>
        <label for="imagen-especie">URL de imagen:</label>
	<input type="url" id="imagen-especie">

	<label for="archivo-imagen">O selecciona una imagen de tu dispositivo:</label>
	<input type="file" id="archivo-imagen" accept="image/*">
	<p id="estado-imagen"></p>
    </div>

    <div>
        <label for="descripcion-especie">Descripción:</label>
        <textarea id="descripcion-especie" required></textarea>
    </div>

    <div id="habitats-especie"></div>

    <button type="submit" id="btn-guardar-especie">Guardar especie</button>

    <button type="button" onclick="cancelarFormularioEspecie()">
        Cancelar
    </button>

</form>
</div>
        </section>

        <section class="panel">
            <h2>Gestión de hábitats</h2>
            <div class="acciones">
                <button>Registrar hábitat</button>
                <button>Consultar hábitats</button>
            </div>
        </section>

        <section class="panel">
            <h2>Gestión de administradores</h2>
            <div class="acciones">
                <button>Crear administrador</button>
            </div>
        </section>

    </main>

<script>
   const API_URL = 'https://econaku.onrender.com';
   let idEspecieEditando = null;
    document.getElementById('archivo-imagen').addEventListener('change', async function () {
    const archivo = this.files[0];

    if (!archivo) return;

    const estado = document.getElementById('estado-imagen');
    const datos = new FormData();

    datos.append('imagen', archivo);
    estado.textContent = 'Subiendo imagen...';

    try {
        const respuesta = await fetch(`${API_URL}/api/admin/subir-imagen`, {
            method: 'POST',
            credentials: 'include',
            body: datos
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(resultado.error || 'No se pudo subir la imagen');
        }

        document.getElementById('imagen-especie').value = resultado.secure_url;
        estado.textContent = 'Imagen subida correctamente.';

    } catch (error) {
        console.error(error);
        estado.textContent = 'Error al subir la imagen: ' + error.message;
    }
});

    
function mostrarFormularioEspecie() {
        idEspecieEditando = null;

        document.getElementById('contenido-especies').innerHTML = '';
        document.getElementById('form-especie').reset();

        document.getElementById('titulo-formulario').textContent =
           'Registrar nueva especie';

        document.getElementById('btn-guardar-especie').textContent =
           'Guardar especie';

        document.getElementById('formulario-especie').style.display = 'block';

        cargarHabitatsEspecie();
}

function cancelarFormularioEspecie() {
        idEspecieEditando = null;

        document.getElementById('formulario-especie').style.display = 'none';
        document.getElementById('form-especie').reset();
        document.getElementById('estado-imagen').textContent = '';

        document.getElementById('titulo-formulario').textContent =
          'Registrar nueva especie';

        document.getElementById('btn-guardar-especie').textContent =
          'Guardar especie';
}

function obtenerDatosEspecie() {
    const habitatIds = Array.from(
        document.querySelectorAll('input[name="habitats"]:checked')
    ).map(input => Number(input.value));

    return {
        codigo: document.getElementById('codigo-especie').value.trim(),
        nombre: document.getElementById('nombre-especie').value.trim(),
        nombre_cientifico: document.getElementById('cientifico-especie').value.trim(),
        categoria: document.getElementById('categoria-especie').value,
        rareza: document.getElementById('rareza-especie').value,
        descripcion: document.getElementById('descripcion-especie').value.trim(),
        imagen_url: document.getElementById('imagen-especie').value.trim(),
        habitatIds: habitatIds
    };
}

async function registrarEspecie(event) {
    event.preventDefault();
    if (document.getElementById('estado-imagen').textContent === 'Subiendo imagen...') {
        alert('Espera a que termine de subir la imagen.');
        return;
    }

    const datosEspecie = obtenerDatosEspecie();

    try {
        const respuesta = await fetch(
           idEspecieEditando
           ? `${API_URL}/api/especies/${idEspecieEditando}`
           : `${API_URL}/api/especies`,
           {
           method: idEspecieEditando ? 'PUT' : 'POST',
               headers: {
                'Content-Type': 'application/json'
               },
               credentials: 'include',
               body: JSON.stringify(datosEspecie)
          });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
            alert(resultado.error || 'No se pudo registrar la especie.');
            return;
        }

        alert(resultado.mensaje);

        cancelarFormularioEspecie();

    } catch (error) {
        console.error('Error al registrar especie:', error);
        alert('No fue posible comunicarse con el servidor.');
    }
}

async function consultarEspecies() {
    const contenedor = document.getElementById('contenido-especies');
    document.getElementById('formulario-especie').style.display = 'none';

    contenedor.innerHTML = '<p>Consultando especies...</p>';

    try {
        const respuesta = await fetch(`${API_URL}/api/especies`, {
            method: 'GET',
            credentials: 'include'
        });

        if (!respuesta.ok) {
            throw new Error('No se pudieron consultar las especies.');
        }

        const especies = await respuesta.json();
        console.log('Especies recibidas:', especies);
        contenedor.innerHTML = '';

        if (especies.length === 0) {
            contenedor.textContent = 'Todavía no hay especies registradas.';
            return;
        }

        const titulo = document.createElement('h3');
        titulo.textContent = 'Especies registradas';
        contenedor.appendChild(titulo);

        especies.forEach(especie => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'panel';

            const nombre = document.createElement('h3');
            nombre.textContent = especie.nombre;
            const imagen = document.createElement('img');
            imagen.src = especie.imagen_url;
            imagen.onerror = () => {
                 console.log('Imagen no cargada:', especie.nombre, especie.imagen_url);
            };

            imagen.onload = () => {
                console.log('Imagen cargada:', especie.nombre);
            };
            imagen.alt = especie.nombre;
            imagen.style.width = '180px';
            imagen.style.height = '140px';
            imagen.style.objectFit = 'cover';
            imagen.style.borderRadius = '10px';

            const codigo = document.createElement('p');
            codigo.textContent = `Código: ${especie.codigo}`;

            const categoria = document.createElement('p');
            categoria.textContent = `Categoría: ${especie.categoria}`;

            const rareza = document.createElement('p');
            rareza.textContent = `Rareza: ${especie.rareza}`;

            const habitats = document.createElement('p');
            habitats.textContent = 'Hábitats: ' +
                (especie.habitats || [])
                    .map(h => h.nombre)
                    .join(', ');

            tarjeta.append(
    		imagen,
    		nombre,
    		codigo,
    		categoria,
    		rareza,
    		habitats
	    );
            
            const btnModificar = document.createElement('button');
            btnModificar.textContent = 'Modificar';

            btnModificar.addEventListener('click', () => {
                 modificarEspecie(especie);
            });

            tarjeta.appendChild(btnModificar);
            contenedor.appendChild(tarjeta);
            console.log('Botón Modificar creado para:', especie.nombre);
        });

    } catch (error) {
        console.error('Error al consultar especies:', error);
        contenedor.textContent = 'No fue posible cargar las especies.';
    }
}

document.getElementById('form-especie').addEventListener(
    'submit',
    registrarEspecie
);

async function cargarHabitatsEspecie(habitatsSeleccionados = []) {
    const contenedor = document.getElementById('habitats-especie');

    contenedor.innerHTML = '<p>Cargando hábitats...</p>';

    try {
        const respuesta = await fetch(`${API_URL}/api/habitats`);

        if (!respuesta.ok) {
            throw new Error('No se pudieron cargar los hábitats.');
        }

        const habitats = await respuesta.json();

        contenedor.innerHTML = '<h3>Hábitats de la especie</h3>';

        habitats.forEach(habitat => {
              const etiqueta = document.createElement('label');

              const checkbox = document.createElement('input');
              checkbox.type = 'checkbox';
              checkbox.name = 'habitats';
              checkbox.value = habitat.id_habitat;

              checkbox.checked = habitatsSeleccionados.includes(
                   Number(habitat.id_habitat)
              );

              etiqueta.append(checkbox, habitat.nombre);
              contenedor.appendChild(etiqueta);
        });

    } catch (error) {
        contenedor.innerHTML = '<p>No fue posible cargar los hábitats.</p>';
        console.error(error);
    }
}

async function modificarEspecie(especie) {
    idEspecieEditando = especie.id_especie;

    document.getElementById('contenido-especies').innerHTML = '';

    document.getElementById('titulo-formulario').textContent =
        'Modificar especie';

    document.getElementById('btn-guardar-especie').textContent =
        'Guardar cambios';

    document.getElementById('formulario-especie').style.display = 'block';

    document.getElementById('codigo-especie').value = especie.codigo;
    document.getElementById('nombre-especie').value = especie.nombre;
    document.getElementById('cientifico-especie').value =
        especie.nombre_cientifico || '';

    document.getElementById('categoria-especie').value = especie.categoria;
    document.getElementById('rareza-especie').value = especie.rareza;

    document.getElementById('imagen-especie').value =
        especie.imagen_url || '';

    document.getElementById('descripcion-especie').value =
        especie.descripcion || '';

    const habitatsSeleccionados = (especie.habitats || [])
        .map(habitat => Number(habitat.id_habitat));

    await cargarHabitatsEspecie(habitatsSeleccionados);
}

async function verificarAdministrador() {
        const panel = document.querySelector('main');
        panel.style.display = 'none';

        try {
            const respuesta = await fetch(`${API_URL}/api/sesion`, {
                method: 'GET',
                credentials: 'include'
            });

            if (!respuesta.ok) {
                alert('Debes iniciar sesión para acceder al panel.');
                window.location.replace('Econaku.html');
                return;
            }

            const datos = await respuesta.json();

            if (!datos.usuario || datos.usuario.rol !== 'admin') {
                alert('No tienes permisos de administrador.');
                window.location.replace('Econaku.html');
                return;
            }

            document.querySelector('.panel h2').textContent =
                `Bienvenido, ${datos.usuario.nombre_usuario}`;

            panel.style.display = 'block';

        } catch (error) {
            alert('No se pudo verificar tu sesión.');
            window.location.replace('Econaku.html');
        }
    }

    verificarAdministrador();
</script>
</body>
</html>
